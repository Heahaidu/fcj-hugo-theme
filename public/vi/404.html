<script>
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute("data-theme") || "dark";
        const next = current === "light" ? "dark" : "light";
        html.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        updateLogo(next);
    }

    function updateLogo(theme) {
        const light = document.querySelector(".logo-light");
        const dark = document.querySelector(".logo-dark");
        if (!light || !dark) return;
        if (theme === "dark") {
            light.style.display = "none";
            dark.style.display = "block";
        } else {
            light.style.display = "block";
            dark.style.display = "none";
        }
    }

    const savedTheme = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);

    (function () {
        const orig = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (type, fn, options) {
            
            if (type === 'touchmove') {
                if (typeof options === 'object') options.passive = true;
                else options = { passive: true, capture: options || false };
            }
            return orig.call(this, type, fn, options);
        };
    })();

</script>
